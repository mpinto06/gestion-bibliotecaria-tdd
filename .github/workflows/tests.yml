name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar pruebas
        run: mvn -B test

      - name: Publicar resultados JUnit
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Resultados JUnit
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Configurar Python
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Publicar métricas en Jira/Confluence
        if: always()
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          CONFLUENCE_PAGE_ID: ${{ vars.CONFLUENCE_PAGE_ID }}
          SUREFIRE_REPORTS_DIR: target/surefire-reports
        run: python3 scripts/publish_metrics.py