name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar pruebas
        run: mvn -B clean test

      - name: Generar reporte de cobertura JaCoCo
        # Paso separado porque "mvn test" puede fallar por tests DEFECTO (fallos esperados);
        # el agente JaCoCo ya escribió target/jacoco.exec durante "test" aunque el build
        # haya fallado, así que solo procesamos ese exec sin volver a correr los tests.
        if: always()
        run: mvn -B jacoco:report

      - name: Publicar resultados JUnit
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Resultados JUnit
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Configurar Python
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Publicar métricas en Jira/Confluence
        if: always()
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          CONFLUENCE_PAGE_ID: ${{ vars.CONFLUENCE_PAGE_ID }}
          SUREFIRE_REPORTS_DIR: target/surefire-reports
          JACOCO_REPORT_PATH: target/site/jacoco/jacoco.xml
        run: python3 scripts/publish_metrics.py